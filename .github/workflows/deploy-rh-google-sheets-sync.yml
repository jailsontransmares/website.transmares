name: Deploy RH Google Sheets sync

on:
  push:
    branches:
      - hub
    paths:
      - 'supabase/functions/rh-google-sheets-sync/**'
      - '.github/workflows/deploy-rh-google-sheets-sync.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy RH Google Sheets Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy rh-google-sheets-sync --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
