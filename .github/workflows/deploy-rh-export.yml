name: Deploy RH employee PDF export

on:
  push:
    branches:
      - hub
    paths:
      - 'supabase/functions/rh-export/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-rh-export.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy RH employee PDF export Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy rh-export --project-ref "$SUPABASE_PROJECT_REF" --use-api
