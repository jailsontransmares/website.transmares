<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurar módulos — Protótipo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #fff;
      --text: #1d2939;
      --muted: #667085;
      --line: #e2e8f0;
      --accent: #1769aa;
      --accent-soft: #edf6fd;
      --danger: #b42318;
      --radius: 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; }
    button, select, input[type="checkbox"] { cursor: pointer; }

    .page { width: min(100%, 1240px); margin: 0 auto; padding: 32px 24px 120px; }
    .back-button, .secondary-button, .primary-button, .filter-button, .bulk-button {
      border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text);
      min-height: 42px; padding: 9px 13px; transition: border-color .15s, background .15s, color .15s;
    }
    button:hover:not(:disabled) { border-color: #a9cce5; background: #f8fbfe; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #c9e2f5; outline-offset: 1px; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 7px 0 5px; font-size: clamp(24px, 4vw, 31px); letter-spacing: -.035em; }
    .description { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .heading { align-items: center; display: flex; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .heading-main { min-width: 0; }
    .summary { display: flex; gap: 8px; flex: 0 0 auto; }
    .summary-pill { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; padding: 8px 12px; white-space: nowrap; }
    .summary-pill strong { color: var(--text); margin-right: 4px; }

    .filters { align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px #1018280a; display: grid; gap: 10px; grid-template-columns: minmax(200px, 1.2fr) minmax(205px, auto) minmax(150px, .75fr) minmax(155px, .75fr); margin-bottom: 28px; padding: 12px; }
    .areas { display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .field-label { color: #475467; font-size: 11px; font-weight: 750; letter-spacing: .055em; text-transform: uppercase; }
    .search, .select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text); padding: 0 12px; }
    .search::placeholder { color: #98a2b3; }
    .filter-group { display: flex; gap: 3px; border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
    .filter-button { flex: 1 1 0; min-height: 36px; text-align: center; color: var(--muted); padding: 6px; }
    .filter-button[aria-pressed="true"] { border-color: #9ac4e2; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .filter-button span { color: inherit; margin-left: 4px; }
    .filters .field-label { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }

    .list-heading { align-items: center; display: flex; justify-content: space-between; gap: 16px; margin: 30px 0 12px; }
    .list-heading-main { display: flex; flex-direction: column; gap: 4px; }
    .list-heading h2 { margin: 0; font-size: 16px; }
    .list-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .legend { display: flex; gap: 16px; color: var(--muted); font-size: 11px; }
    .legend span { align-items: center; display: inline-flex; gap: 6px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; background: #138a50; }
    .legend .unavailable { background: #aeb8c5; }
    .area { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .area-header { align-items: center; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) 210px 376px; padding: 15px; background: #f9fbfd; border-bottom: 1px solid var(--line); }
    .area-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .area-title { margin: 0; font-size: 15px; }
    .area-count { color: var(--muted); font-size: 12px; }
    .column-headings { display: grid; grid-template-columns: 112px 120px 120px; gap: 12px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .04em; text-align: center; text-transform: uppercase; }
    .bulk-actions { align-items: center; display: flex; gap: 4px; min-width: 0; }
    .bulk-button { align-items: center; display: inline-flex; flex: 0 0 32px; height: 32px; justify-content: center; min-height: 32px; padding: 4px; color: var(--muted); }
    .bulk-button svg { width: 17px; height: 17px; }
    .bulk-button.is-activate { background: #effaf3; border-color: #c8ead5; color: #16804a; }
    .bulk-button.is-deactivate { background: #fff3f3; border-color: #f2d2d2; color: #c43232; }
    .bulk-button.is-show { background: var(--accent-soft); border-color: #c9dff0; color: var(--accent); }
    .bulk-button.is-hide { background: #f1f4f8; border-color: var(--line); color: var(--muted); }
    .bulk-button.is-activate:hover:not(:disabled) { background: #e5f6eb; border-color: #a9dcbc; }
    .bulk-button.is-deactivate:hover:not(:disabled) { background: #fdeaea; border-color: #e8b5b5; }
    .bulk-button.is-show:hover:not(:disabled) { background: #e3f1fb; border-color: #a9cce5; }
    .bulk-button.is-hide:hover:not(:disabled) { background: #e8edf3; border-color: #c9d2dd; }
    .module-list { padding: 0 15px; }
    .module { align-items: center; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) 112px 120px 120px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .module:last-child { border-bottom: 0; }
    .module-title { align-items: center; display: flex; gap: 10px; margin: 0; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.4; }
    .module-title.is-submodule { padding-left: 14px; color: #344054; font-weight: 600; }
    .module-icon { align-items: center; background: var(--accent-soft); border-radius: 9px; color: var(--accent); display: inline-flex; flex: 0 0 36px; font-size: 13px; font-weight: 800; height: 36px; justify-content: center; width: 36px; }
    .module-title > span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .setting { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .setting-label { display: none; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .055em; text-transform: uppercase; }
    .protected { align-items: center; color: #16804a; display: inline-flex; gap: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .protected small { border-radius: 999px; background: #eef2f6; color: var(--muted); font-size: 9px; letter-spacing: .04em; padding: 4px 6px; text-transform: uppercase; }
    .status-protected { border-radius: 999px; background: #eef2f6; color: var(--muted); font-size: 9px; letter-spacing: .04em; padding: 4px 6px; text-transform: uppercase; }
    .toggle-setting { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .switch { position: relative; display: inline-flex; width: 46px; height: 26px; flex: 0 0 auto; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .switch-track { position: absolute; inset: 0; border-radius: 999px; background: #d0d5dd; transition: background .15s; }
    .switch-track::after { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: white; box-shadow: 0 1px 3px #0002; content: ""; transition: transform .15s; }
    .switch input:checked + .switch-track { background: var(--accent); }
    .switch input:checked + .switch-track::after { transform: translateX(20px); }
    .switch input:focus-visible + .switch-track { outline: 3px solid #c9e2f5; outline-offset: 2px; }
    .toggle-value { display: none; color: var(--muted); font-size: 12px; }
    .empty { padding: 30px 12px; color: var(--muted); text-align: center; }

    .actions { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 12px; margin-top: 28px; padding: 14px 0 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 94%, transparent); }
    .note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .action-buttons { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .action-buttons button { width: min(100%, 220px); min-height: 44px; }
    .primary-button { border-color: var(--accent); background: var(--accent); color: white; font-weight: 700; }
    .primary-button:hover:not(:disabled) { border-color: #0e548d; background: #0e548d; color: white; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 5; max-width: min(360px, calc(100vw - 40px)); padding: 12px 16px; border: 1px solid #b7dfc4; border-radius: 10px; background: #f0fdf4; color: #176b38; box-shadow: 0 8px 28px #1018281a; }
    [hidden] { display: none !important; }

    @media (max-width: 1050px) and (min-width: 701px) {
      .filters { grid-template-columns: minmax(180px, 1fr) minmax(190px, auto); }
      .area-header { grid-template-columns: minmax(0, 1fr) 190px 344px; }
      .column-headings { grid-template-columns: 100px 110px 110px; gap: 12px; }
      .module { grid-template-columns: minmax(0, 1fr) 100px 110px 110px; }
    }
    @media (max-width: 700px) {
      .page { padding: 20px 14px 120px; }
      .heading { align-items: flex-start; flex-direction: column; gap: 14px; }
      .filters { grid-template-columns: minmax(0, 1fr); }
      .filters .field-label { clip-path: none; height: auto; overflow: visible; position: static; width: auto; }
      .area-header { align-items: stretch; display: flex; flex-direction: column; gap: 9px; padding: 13px; }
      .column-headings { display: none; }
      .list-heading { align-items: flex-start; flex-direction: column; }
      .module { grid-template-columns: minmax(0, 1fr); gap: 11px; padding: 14px 0; }
      .setting { align-items: stretch; }
      .setting-label { display: block; }
      .toggle-setting { align-items: flex-start; flex-direction: row; }
      .toggle-value { display: inline; }
      .bulk-actions { flex-direction: row; flex-wrap: nowrap; }
      .bulk-button { flex: 0 0 32px; width: 32px; }
      .action-buttons button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="heading">
      <div class="heading-main">
        <div class="eyebrow">Administração / Módulos</div>
        <h1>Configurar módulos</h1>
        <p class="description">Defina status, presença na Home e acesso por perfil em um único lugar.</p>
      </div>
      <div class="summary" aria-label="Resumo dos módulos">
        <span class="summary-pill"><strong id="activeCount">0</strong> ativos</span>
        <span class="summary-pill"><strong id="visibleCount">0</strong> visíveis</span>
      </div>
    </header>

    <section class="filters" aria-label="Filtros dos módulos">
      <label class="field">
        <span class="field-label">Buscar</span>
        <input class="search" id="search" type="search" placeholder="Buscar módulo ou submódulo..." autocomplete="off">
      </label>
      <div class="field">
        <span class="field-label">Exibição</span>
        <div class="filter-group" role="group" aria-label="Filtrar por visibilidade">
          <button class="filter-button" type="button" data-filter="todos" aria-pressed="true">Todos <span data-count="todos">0</span></button>
          <button class="filter-button" type="button" data-filter="visiveis" aria-pressed="false">Visíveis <span data-count="visiveis">0</span></button>
          <button class="filter-button" type="button" data-filter="ocultos" aria-pressed="false">Ocultos <span data-count="ocultos">0</span></button>
        </div>
      </div>
      <label class="field">
        <span class="field-label">Área</span>
        <select class="select" id="areaSelect" aria-label="Filtrar por área"></select>
      </label>
      <label class="field">
        <span class="field-label">Perfil</span>
        <select class="select" id="profileSelect" aria-label="Escolher perfil para configurar"></select>
      </label>
    </section>

    <section aria-labelledby="modulesTitle">
      <div class="list-heading">
        <div class="list-heading-main">
          <h2 id="modulesTitle">Módulos e submódulos</h2>
          <p id="resultSummary" aria-live="polite"></p>
        </div>
        <div class="legend" aria-label="Legenda de status"><span><i></i>Disponível</span><span><i class="unavailable"></i>Indisponível</span></div>
      </div>
      <div class="areas" id="areas"></div>
    </section>

    <footer class="actions">
      <p class="note">As alterações serão aplicadas ao salvar.</p>
      <div class="action-buttons">
        <button class="secondary-button" id="cancelButton" type="button">Cancelar</button>
        <button class="primary-button" id="saveButton" type="button" disabled>Salvar alterações</button>
      </div>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    const profiles = [
      { id: 'administrador', name: 'Administrador' },
      { id: 'operacional', name: 'Operacional' },
      { id: 'comercial', name: 'Comercial' }
    ];

    const bulkIcons = {
      activate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
      deactivate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6m0-6 6 6"/></svg>',
      show: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
      hide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3-.5"/></svg>'
    };

    const modules = [
      { id: 'links-corretora', area: 'Corretora', name: 'Links da Corretora', status: 'ativo', visible: true, permission: 'links_corretora' },
      { id: 'painel-ar', area: 'AR', name: 'Painel AR', status: 'ativo', visible: true, permission: 'painel_ar', protected: true },
      { id: 'painel-ar-inicio', area: 'AR', name: 'Início', parent: 'Painel AR', status: 'ativo', visible: true, permission: 'painel_ar', submodule: true },
      { id: 'painel-ar-gerar', area: 'AR', name: 'Gerar Links', parent: 'Painel AR', status: 'ativo', visible: true, permission: 'painel_ar.gerar_links', submodule: true },
      { id: 'painel-ar-validacoes', area: 'AR', name: 'Validações', parent: 'Painel AR', status: 'ativo', visible: false, permission: 'painel_ar.validacoes', submodule: true },
      { id: 'central-senhas', area: 'Gestão', name: 'Central de Senhas', status: 'ativo', visible: true, permission: 'central_senhas' },
      { id: 'central-senhas-acessos', area: 'Gestão', name: 'Senhas Salvas', parent: 'Central de Senhas', status: 'ativo', visible: true, permission: 'central_senhas', submodule: true },
      { id: 'central-senhas-links', area: 'Gestão', name: 'Links Úteis', parent: 'Central de Senhas', status: 'ativo', visible: false, permission: 'central_senhas', submodule: true },
      { id: 'admin', area: 'Gestão', name: 'Administração', status: 'ativo', visible: true, permission: 'admin' },
      { id: 'admin-usuarios', area: 'Gestão', name: 'Usuários', parent: 'Administração', status: 'ativo', visible: true, permission: 'admin.usuarios', submodule: true },
      { id: 'admin-perfis', area: 'Gestão', name: 'Perfis de Acesso', parent: 'Administração', status: 'ativo', visible: true, permission: 'admin.perfis', submodule: true },
      { id: 'consultoria-360', area: 'Operações > Corretora', name: 'Consultoria 360°', status: 'ativo', visible: true, permission: 'consultoria_360' },
      { id: 'financeiro-dashboard', area: 'Financeiro', name: 'Dashboard', status: 'ativo', visible: true, permission: 'financeiro.dashboard' },
      { id: 'financeiro-lancamentos', area: 'Financeiro', name: 'Lançamentos', status: 'inativo', visible: false, permission: 'financeiro.lancamentos' }
    ];

    const profileAccess = Object.fromEntries(profiles.map(profile => [profile.id, {
      admin: true,
      admin_usuarios: profile.id === 'administrador',
      admin_perfis: profile.id === 'administrador',
      central_senhas: profile.id !== 'comercial',
      links_corretora: profile.id !== 'operacional',
      painel_ar: true,
      painel_ar_gerar_links: profile.id !== 'operacional',
      painel_ar_validacoes: profile.id !== 'comercial',
      consultoria_360: profile.id === 'comercial',
      financeiro_dashboard: profile.id === 'administrador',
      financeiro_lancamentos: profile.id === 'administrador'
    }]));

    const permissionKey = key => key.replaceAll('.', '_');
    const state = {
      selectedProfile: profiles[0].id,
      filter: 'todos',
      area: 'todas',
      search: '',
      originalModules: structuredClone(modules),
      originalAccess: structuredClone(profileAccess)
    };

    const areaSelect = document.querySelector('#areaSelect');
    const profileSelect = document.querySelector('#profileSelect');
    const areasRoot = document.querySelector('#areas');
    const saveButton = document.querySelector('#saveButton');
    const toast = document.querySelector('#toast');
    let toastTimer;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function initializeSelects() {
      areaSelect.innerHTML = '<option value="todas">Todas as áreas</option>' + [...new Set(modules.map(item => item.area))]
        .map(area => `<option value="${escapeHtml(area)}">${escapeHtml(area)}</option>`).join('');
      profileSelect.innerHTML = profiles.map(profile => `<option value="${profile.id}">${escapeHtml(profile.name)}</option>`).join('');
    }

    function getCounts() {
      return {
        todos: modules.length,
        visiveis: modules.filter(item => item.visible).length,
        ocultos: modules.filter(item => !item.visible).length
      };
    }

    function getVisibleModules() {
      const query = state.search.trim().toLocaleLowerCase('pt-BR');
      return modules.filter(item => {
        const matchesSearch = !query || `${item.name} ${item.parent || ''} ${item.area}`.toLocaleLowerCase('pt-BR').includes(query);
        const matchesArea = state.area === 'todas' || item.area === state.area;
        const matchesVisibility = state.filter === 'todos' || (state.filter === 'visiveis' ? item.visible : !item.visible);
        return matchesSearch && matchesArea && matchesVisibility;
      });
    }

    function hasChanges() {
      return JSON.stringify(modules) !== JSON.stringify(state.originalModules)
        || JSON.stringify(profileAccess) !== JSON.stringify(state.originalAccess);
    }

    function render() {
      const counts = getCounts();
      document.querySelectorAll('[data-count]').forEach(node => node.textContent = counts[node.dataset.count]);
      document.querySelectorAll('[data-filter]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === state.filter)));

      const visibleModules = getVisibleModules();
      document.querySelector('#resultSummary').textContent = `${visibleModules.length} ${visibleModules.length === 1 ? 'item encontrado' : 'itens encontrados'}`;
      const groups = [...new Set(visibleModules.map(item => item.area))];

      areasRoot.innerHTML = groups.length ? groups.map(area => {
        const items = visibleModules.filter(item => item.area === area);
        return `<section class="area" aria-label="Área ${escapeHtml(area)}">
          <header class="area-header">
            <div class="area-name">
              <h3 class="area-title">${escapeHtml(area)}</h3>
              <span class="area-count">${items.length}</span>
            </div>
            <div class="bulk-actions" role="group" aria-label="Ações em lote para ${escapeHtml(area)}">
              <button class="bulk-button is-activate" type="button" data-bulk="activate" data-area="${escapeHtml(area)}" title="Ativar todos" aria-label="Ativar todos">${bulkIcons.activate}</button>
              <button class="bulk-button is-deactivate" type="button" data-bulk="deactivate" data-area="${escapeHtml(area)}" title="Inativar todos" aria-label="Inativar todos">${bulkIcons.deactivate}</button>
              <button class="bulk-button is-show" type="button" data-bulk="show" data-area="${escapeHtml(area)}" title="Exibir todos" aria-label="Exibir todos">${bulkIcons.show}</button>
              <button class="bulk-button is-hide" type="button" data-bulk="hide" data-area="${escapeHtml(area)}" title="Ocultar todos" aria-label="Ocultar todos">${bulkIcons.hide}</button>
            </div>
            <div class="column-headings" aria-hidden="true"><span>Status</span><span>Na Home</span><span>Acesso</span></div>
          </header>
          <div class="module-list">${items.map(renderModule).join('')}</div>
        </section>`;
      }).join('') : '<div class="area empty">Nenhum módulo encontrado com esses filtros.</div>';

      document.querySelector('#activeCount').textContent = modules.filter(item => item.status === 'ativo').length;
      document.querySelector('#visibleCount').textContent = counts.visiveis;
      saveButton.disabled = !hasChanges();
    }

    function renderModule(item) {
      const key = permissionKey(item.permission);
      const allowed = profileAccess[state.selectedProfile][key] !== false;
      const name = escapeHtml(item.name);
      return `<article class="module">
        <h4 class="module-title${item.submodule ? ' is-submodule' : ''}"><span class="module-icon" aria-hidden="true">${item.submodule ? '↳' : name.slice(0, 1).toUpperCase()}</span><span>${name}</span></h4>
        <div class="setting">
          <span class="setting-label">Status geral</span>
          <label class="toggle-setting">
            <span class="switch"><input type="checkbox" data-status="${item.id}" aria-label="${item.protected && item.status === 'ativo' ? 'Status Ativo, módulo protegido' : `${item.status === 'ativo' ? 'Inativar' : 'Ativar'} ${name}`}" ${item.status === 'ativo' ? 'checked' : ''} ${item.protected && item.status === 'ativo' ? 'disabled' : ''}><span class="switch-track" aria-hidden="true"></span></span>
            <span class="toggle-value">${item.status === 'ativo' ? 'Ativo' : 'Inativo'}</span>
            ${item.protected && item.status === 'ativo' ? '<small class="status-protected">Protegido</small>' : ''}
          </label>
        </div>
        <div class="setting">
          <span class="setting-label">Exibição na Home</span>
          <label class="toggle-setting">
            <span class="switch"><input type="checkbox" data-visible="${item.id}" aria-label="Alternar exibição de ${name}" ${item.visible ? 'checked' : ''} ${item.status === 'inativo' ? 'disabled' : ''}><span class="switch-track" aria-hidden="true"></span></span>
            <span class="toggle-value">${item.visible ? 'Visível' : 'Oculto'}</span>
          </label>
        </div>
        <div class="setting">
          <span class="setting-label">Acesso: ${escapeHtml(profiles.find(profile => profile.id === state.selectedProfile).name)}</span>
          <label class="toggle-setting">
            <span class="switch"><input type="checkbox" data-access="${key}" aria-label="Alternar acesso de ${name}" ${allowed ? 'checked' : ''}><span class="switch-track" aria-hidden="true"></span></span>
            <span class="toggle-value">${allowed ? 'Liberado' : 'Bloqueado'}</span>
          </label>
        </div>
      </article>`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.hidden = true, 2600);
    }

    function save() {
      state.originalModules = structuredClone(modules);
      state.originalAccess = structuredClone(profileAccess);
      render();
      showToast('Alterações salvas neste protótipo.');
    }

    function cancel() {
      modules.splice(0, modules.length, ...structuredClone(state.originalModules));
      Object.keys(profileAccess).forEach(id => delete profileAccess[id]);
      Object.assign(profileAccess, structuredClone(state.originalAccess));
      render();
      showToast('Alterações descartadas.');
    }

    document.addEventListener('input', event => {
      if (event.target.id === 'search') { state.search = event.target.value; render(); }
    });
    document.addEventListener('change', event => {
      const target = event.target;
      if (target.id === 'areaSelect') { state.area = target.value; render(); }
      else if (target.id === 'profileSelect') { state.selectedProfile = target.value; render(); }
      else if (target.matches('[data-status]')) {
        const item = modules.find(module => module.id === target.dataset.status);
        if (item) {
          item.status = target.checked ? 'ativo' : 'inativo';
          if (!target.checked) item.visible = false;
          render();
        }
      } else if (target.matches('[data-visible]')) {
        const item = modules.find(module => module.id === target.dataset.visible);
        if (item) { item.visible = target.checked; render(); }
      } else if (target.matches('[data-access]')) {
        profileAccess[state.selectedProfile][target.dataset.access] = target.checked;
        render();
      }
    });
    document.addEventListener('click', event => {
      const filter = event.target.closest('[data-filter]');
      if (filter) { state.filter = filter.dataset.filter; render(); return; }
      const bulk = event.target.closest('[data-bulk]');
      if (bulk) {
        modules.filter(item => item.area === bulk.dataset.area).forEach(item => {
          if (bulk.dataset.bulk === 'activate') item.status = 'ativo';
          if (bulk.dataset.bulk === 'deactivate') { item.status = 'inativo'; item.visible = false; }
          if (bulk.dataset.bulk === 'show' && item.status !== 'inativo') item.visible = true;
          if (bulk.dataset.bulk === 'hide') item.visible = false;
        });
        render();
      }
    });
    document.querySelector('#saveButton').addEventListener('click', save);
    document.querySelector('#cancelButton').addEventListener('click', cancel);
    initializeSelects();
    render();
  </script>
</body>
</html>
